<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <main>
      <div class="history">
        <i class="fa-solid fa-clock-rotate-left"></i>
      </div>
      <div id="display-screen" class="display"></div>
      <div class="btns">
        <button id="delete" class="del function">
          <i class="fa-solid fa-delete-left"></i>
        </button>
        <button onclick="clearScreen()" id="reset" class="function">AC</button>
        <button onclick="appendNumber('%')" class="function">%</button>
        <button onclick="appendNumber('/')" class="operator">
          <i class="fa-solid fa-divide"></i>
        </button>
        <button onclick="appendNumber('7')" class="num">7</button>
        <button onclick="appendNumber('8')" class="num">8</button>
        <button onclick="appendNumber('9')" class="num">9</button>
        <button onclick="appendNumber('x')" class="operator">
          <i class="fa-solid fa-x"></i>
        </button>
        <button onclick="appendNumber('4')" class="num">4</button>
        <button onclick="appendNumber('5')" class="num">5</button>
        <button onclick="appendNumber('6')" class="num">6</button>
        <button onclick="appendNumber('-')" class="operator">
          <i class="fa-solid fa-minus"></i>
        </button>
        <button onclick="appendNumber('1')" class="num">1</button>
        <button onclick="appendNumber('2')" class="num">2</button>
        <button onclick="appendNumber('3')" class="num">3</button>
        <button onclick="appendNumber('+')" class="operator">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button id="plusminus" class="num">
          <i class="fa-solid fa-plus-minus"></i>
        </button>
        <button onclick="appendNumber('0')" class="num">0</button>
        <button onclick="appendNumber('.')" class="num">.</button>
        <button id="equal" class="operator">=</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
