<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <main>
      <div class="head">
        <span class="time">9:41</span>
        <div class="device">
          <span><i class="fa-solid fa-signal"></i></span>
          <span><i class="fa-solid fa-wifi"></i></span>
          <span><i class="fa-solid fa-battery-full"></i></span>
        </div>
      </div>
      <div class="history">
        <i class="fa-solid fa-clock-rotate-left"></i>
      </div>
      <div class="display"></div>
      <div class="btns">
        <button class="del function">
          <i class="fa-solid fa-delete-left"></i>
        </button>
        <button class="reset function">AC</button>
        <button class="percentage function">%</button>
        <button class="div operator"><i class="fa-solid fa-divide"></i></button>
        <button class="num">7</button>
        <button class="num">8</button>
        <button class="num">9</button>
        <button class="multiply operator"><i class="fa-solid fa-x"></i></button>
        <button class="num">4</button>
        <button class="num">5</button>
        <button class="num">6</button>
        <button class="minus operator">
          <i class="fa-solid fa-minus"></i>
        </button>
        <button class="num">1</button>
        <button class="num">2</button>
        <button class="num">3</button>
        <button class="addition operator">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button class="plusminus num">
          <i class="fa-solid fa-plus-minus"></i>
        </button>
        <button class="num">0</button>
        <button class="num">.</button>
        <button class="equal operator">=</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
